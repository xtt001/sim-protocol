# eval_suite_v0.yaml — Shared AGX Excavation Eval Suite Skeleton
#
# Repo: sim-protocol (Repo C - shared)
# Last updated: 2026-04-24
# Status: aligned to current known Repo B / Repo A behavior.
# Unsettled values remain explicit TODOs.

suite_name: "agx_excavation_v0"
suite_version: "v0"
protocol_version: "agx-sim/v0"
schema_version: "1.1"

observations:
  env_state_order:
    0: mass_in_bucket_kg
    1: excavated_mass_kg
    2: mass_in_target_box_kg
    3: deposited_mass_in_target_box_kg
    4: min_distance_to_target_m
    5: target_hard_collision_count
    6: target_contact_max_normal_force_n
    7: min_distance_to_dig_area_m
    8: bucket_depth_below_dig_area_plane_m
    9: target_horizontal_distance_m
    10: bucket_height_above_target_rim_m
    11: bucket_over_target_footprint_mask
    12: dump_clearance_ok_mask
    13: bucket_dump_area_relative_x_m
    14: bucket_dump_area_relative_z_m
    15: bucket_dump_area_footprint_outside_distance_m
  target_geometry_contract:
    required_for_target_safety_training:
      - target_horizontal_distance_m
      - bucket_height_above_target_rim_m
      - bucket_over_target_footprint_mask
      - dump_clearance_ok_mask
      - bucket_dump_area_relative_x_m
      - bucket_dump_area_relative_z_m
      - bucket_dump_area_footprint_outside_distance_m
    valid_when: "all seven target/dump-area geometry fields are present and target_horizontal_distance_m >= 0.0"
    no_legacy_fallback: true
    note: "min_distance_to_target_m is retained as a legacy diagnostic scalar only."

reward:
  hard_collision_penalty: 0.75
  dig_area_touch_tolerance_m: 0.05
  dig_below_plane_depth_tolerance_m: 0.02
  note: "Apply once per step when cumulative target_hard_collision_count increases. Success remains mass-based, and shaped loading opens only after a qualified DigArea good start when DigArea fields are present."

success:
  rule: "retained_target_mass_hold"
  mass_thresh_kg: 100.0
  hold_steps: 25
  env_state_signal: "deposited_mass_in_target_box_kg"
  env_state_index: 3
  note: "Current default aligned with Repo A mission success: retained target mass must stay above threshold for the configured hold window."

rollout:
  control_hz: 50
  dt: 0.02
  episode_len: 1000
  num_rollouts_default: 10
  num_rollouts_final: 50
  step_log_interval: 50

scenarios:
  - id: "s0_baseline"
    description: "Current baseline fixed reset in the Unity scene."
    seeds: [0, 1, 2]
    reset_terrain: false
    reset_pose: true
    scenario_id: ""
    notes:
      - "Use current Unity default scene content."
      - "Broader terrain/scenario coverage belongs in a later eval suite revision."

artifacts:
  metrics_file: "metrics.json"
  results_csv: "results.csv"
  rollout_manifest_file: "rollout_manifest.json"
  rollout_log_dir: "rollouts/"
  rollout_jsonl_pattern: "rollout_{id:03d}.jsonl"
  rollout_summary_pattern: "rollout_{id:03d}_summary.json"
  video_dir: "videos/"
  save_video: true
  save_rollout_logs: true

determinism:
  reset_mode: "baseline_fixed"
  note: >
    V0 assumes repeatable reset pose and empty-bucket state.
    Full seeded terrain determinism is not locked yet.

baselines: {}
