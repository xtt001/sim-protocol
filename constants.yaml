# constants.yaml — Shared AGXUnity / Python Constants
#
# Repo: sim-protocol (Repo C - shared)
# Last updated: 2026-04-24
# Status: aligned to the current Repo B implementation where values are known.
# Unsettled values are left null or explicitly noted as provisional.

protocol:
  header_version: 1
  logical_version: "agx-sim/v0"
  magic: 0xA6A6A6A6
  header_size_bytes: 16
  max_payload_bytes: 134217728

  msg_types:
    GET_INFO_REQ: 1
    GET_INFO_RESP: 2
    RESET_REQ: 3
    RESET_RESP: 4
    STEP_REQ: 5
    STEP_RESP: 6

  image_pixel_format: "raw_rgb"
  image_row_order: "top_to_bottom"

control:
  hz: 50
  dt: 0.02

action:
  dim: 4
  semantics: "actuator_speed_cmd"
  range: [-1.0, 1.0]
  order:
    0: swing_speed_cmd
    1: boom_speed_cmd
    2: stick_speed_cmd
    3: bucket_speed_cmd

  teleop_defaults:
    deadzone: [0.05, 0.05, 0.05, 0.05]
    scale: [1.0, 1.0, 1.0, 1.0]
    limit: [1.0, 1.0, 1.0, 1.0]
    invert: [false, true, false, true]

qpos:
  dim: 4
  range: [0.0, 1.0]
  order:
    0: swing_position_norm
    1: boom_position_norm
    2: stick_position_norm
    3: bucket_position_norm

  notes:
    - "swing_position_norm is present in the current Unity implementation."
    - "Its normalization window is scene/config dependent and not a true hard-limit definition."
    - "boom values currently come from BoomPrismatics[0]."

qvel:
  dim: 4
  units: "runtime_reported_actuator_speed"
  order:
    0: swing_speed
    1: boom_speed
    2: stick_speed
    3: bucket_speed

env_state:
  dim: 16
  order:
    0: mass_in_bucket_kg
    1: excavated_mass_kg
    2: mass_in_target_box_kg
    3: deposited_mass_in_target_box_kg
    4: min_distance_to_target_m
    5: target_hard_collision_count
    6: target_contact_max_normal_force_n
    7: min_distance_to_dig_area_m
    8: bucket_depth_below_dig_area_plane_m
    9: target_horizontal_distance_m
    10: bucket_height_above_target_rim_m
    11: bucket_over_target_footprint_mask
    12: dump_clearance_ok_mask
    13: bucket_dump_area_relative_x_m
    14: bucket_dump_area_relative_z_m
    15: bucket_dump_area_footprint_outside_distance_m

  mass_in_bucket_kg:
    index: 0
    units: "kg"
    notes: "Current bucket-contained dynamic material estimate."

  excavated_mass_kg:
    index: 1
    units: "kg"
    notes: "Cumulative positive bucket-load gain within the current episode."

  mass_in_target_box_kg:
    index: 2
    units: "kg"
    notes: "Current measured mass inside the currently active Unity dump target."

  deposited_mass_in_target_box_kg:
    index: 3
    units: "kg"
    notes: "Reset-relative net retained mass inside the currently active Unity dump target."

  min_distance_to_target_m:
    index: 4
    units: "m"
    notes: "Legacy approximate minimum distance between the current bucket target-distance proxy volume and the active target distance geometry; retained for diagnostics only and not a fallback for target-safety geometry; -1.0 means unavailable."

  target_hard_collision_count:
    index: 5
    units: "count"
    notes: "Cumulative episode count of monitored hard-collision contact sessions against the active dump target; one continuous contact session increments at most once and the next increment requires leaving the target first."

  target_contact_max_normal_force_n:
    index: 6
    units: "N"
    notes: "Current-step maximum monitored solved normal force across excavator-vs-active-target contacts; 0.0 means no monitored contact."

  min_distance_to_dig_area_m:
    index: 7
    units: "m"
    notes: "Approximate minimum distance between the current bucket measurement volume and the scene DigArea thin box; 0.0 means touching or overlapping, -1.0 means unavailable."

  bucket_depth_below_dig_area_plane_m:
    index: 8
    units: "m"
    notes: "Current bucket depth below the DigArea plane, computed as max(0, dig_plane_y - bucket_world_min_y)."

  target_horizontal_distance_m:
    index: 9
    units: "m"
    notes: "Explicit horizontal planar distance between the bucket target-distance proxy footprint and the active target clearance footprint; 0.0 means the two footprints overlap; -1.0 means unavailable."

  bucket_height_above_target_rim_m:
    index: 10
    units: "m"
    notes: "Bucket target-distance proxy bottom height relative to the active target clearance volume top/rim; positive means above the rim, negative means below it."

  bucket_over_target_footprint_mask:
    index: 11
    units: "mask"
    notes: "Float mask, 1.0 when the bucket target-distance proxy footprint overlaps the active target clearance footprint, otherwise 0.0."

  dump_clearance_ok_mask:
    index: 12
    units: "mask"
    notes: "Float mask, 1.0 when the bucket is within the active dump area's horizontal tolerance and bucket_height_above_target_rim_m >= 0.0, otherwise 0.0. Vertical clearance is not tolerant."

  bucket_dump_area_relative_x_m:
    index: 13
    units: "m"
    notes: "Bucket target-distance proxy center x in the active dump-area local frame."

  bucket_dump_area_relative_z_m:
    index: 14
    units: "m"
    notes: "Bucket target-distance proxy center z in the active dump-area local frame."

  bucket_dump_area_footprint_outside_distance_m:
    index: 15
    units: "m"
    notes: "Unsigned horizontal distance from the bucket proxy footprint to the active dump-area footprint; 0.0 means overlapping or inside."

  target_geometry_contract:
    required_for_target_safety_training:
      - target_horizontal_distance_m
      - bucket_height_above_target_rim_m
      - bucket_over_target_footprint_mask
      - dump_clearance_ok_mask
      - bucket_dump_area_relative_x_m
      - bucket_dump_area_relative_z_m
      - bucket_dump_area_footprint_outside_distance_m
    valid_when: "all seven target/dump-area geometry fields are present and target_horizontal_distance_m >= 0.0"
    no_legacy_fallback: true
    notes: "Repo A target-safety reward, filtering, and scripted dump guards require this explicit geometry contract. min_distance_to_target_m is legacy diagnostics only."

collision_monitoring:
  hard_collision_normal_force_thresh_n: 5000.0
  note: "Unity scene default used to threshold target_hard_collision_count."

wire_reward:
  field: "STEP_RESP.reward"
  source_signal: "deposited_mass_in_target_box_kg"
  units: "kg"
  semantics: "backup_success_proxy"
  note: "Unity mirrors retained target mass into the reward slot as a backup scalar. Repo A still computes the primary AGX mission reward locally."

success:
  rule: "retained_target_mass_hold"
  mass_thresh_kg: 100.0
  hold_steps: 25
  env_state_signal: "deposited_mass_in_target_box_kg"
  env_state_index: 3
  note: "Current V0 default: success if retained target mass stays above threshold for the configured hold window within the 1000-step stationary digging episode."

reward:
  hard_collision_penalty: 0.75
  dig_area_touch_tolerance_m: 0.05
  dig_below_plane_depth_tolerance_m: 0.02
  note: "Repo A mission reward subtracts this fixed penalty once per step when cumulative target_hard_collision_count increases. Unity wire reward is unchanged, and shaped loading opens only after a qualified DigArea good start when DigArea geometry fields are present."

cameras:
  fpv:
    required: true
    pixel_format: "raw_rgb"
    row_order: "top_to_bottom"
    descriptor_from_get_info: true
    width: null
    height: null
    fps: null
    notes:
      - "Dimensions and fps are runtime-advertised by GET_INFO_RESP."

schema:
  version: "1.1"

reset:
  supports_reset_pose: true
  mode: "baseline_fixed"
  future_modes:
    - "seeded_deterministic"
